aid: newforma
name: Newforma
description: >-
  Newforma builds project information management software for the architecture, engineering, and
  construction (AEC) industry. Its cloud platform Newforma Konekt (formerly BIM Track by BIM One)
  exposes a REST API and a buildingSMART BCF REST API for BIM coordination — managing hubs, projects,
  and issues along with their viewpoints, attachments, comments, history, sheets, models, and users.
  Integrations authenticate with OAuth 2.0 / OpenID Connect (PKCE) or a Hub-owner API access token.
  Newforma also ships the on-premises Project Center and the cloud ConstructEx products.
